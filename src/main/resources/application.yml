server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: bilibili-music

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/bilibili?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开启驼峰命名映射
    map-underscore-to-camel-case: true
    # 打印 SQL 日志（生产环境建议关闭）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      # 主键类型（自增）
      id-type: auto

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen2.5:7b}
  judge-models: ${OLLAMA_JUDGE_MODELS:qwen2.5:7b,qwen2.5:3b,qwen2.5:1.5b}
  judge-quorum: ${OLLAMA_JUDGE_QUORUM:0}
  judge-timeout-ms: ${OLLAMA_JUDGE_TIMEOUT_MS:8000}
  embeddings-enabled: ${OLLAMA_EMBEDDINGS_ENABLED:false}
  embedding-model: ${OLLAMA_EMBED_MODEL:bge-m3:latest}

bilibili:
  search-url-template: "https://search.bilibili.com/all?keyword={query}&from_source=webtop_search&spm_id_from=333.1007&search_source=3"
  headless: ${BILIBILI_HEADLESS:true}  # 设置为 true 时不显示浏览器窗口
  search-timeout-ms: ${BILIBILI_SEARCH_TIMEOUT_MS:25000}
  navigate-timeout-ms: ${BILIBILI_NAVIGATE_TIMEOUT_MS:15000}
  detail-fetch-timeout-ms: ${BILIBILI_DETAIL_FETCH_TIMEOUT_MS:6000}
  detail-fetch-concurrency: ${BILIBILI_DETAIL_FETCH_CONCURRENCY:8}
  daily-rank-url: ${BILIBILI_DAILY_RANK_URL:https://api.bilibili.com/x/web-interface/ranking/v2?rid=3&type=all}
  daily-rank-timeout-ms: ${BILIBILI_DAILY_RANK_TIMEOUT_MS:8000}
  daily-rank-cache-seconds: ${BILIBILI_DAILY_RANK_CACHE_SECONDS:600}

recommend:
  daily:
    personal-weight: ${RECOMMEND_DAILY_PERSONAL_WEIGHT:0.7}
    rank-weight: ${RECOMMEND_DAILY_RANK_WEIGHT:0.3}
  recall:
    per-query-limit: ${RECOMMEND_RECALL_PER_QUERY_LIMIT:20}
    max-candidates-multiplier: ${RECOMMEND_RECALL_MAX_CANDIDATES_MULTIPLIER:3}
    enable-preference: ${RECOMMEND_RECALL_ENABLE_PREFERENCE:true}
    enable-daily: ${RECOMMEND_RECALL_ENABLE_DAILY:true}
    preference-artist-top: ${RECOMMEND_RECALL_PREFERENCE_ARTIST_TOP:2}
    preference-keyword-top: ${RECOMMEND_RECALL_PREFERENCE_KEYWORD_TOP:2}
    min-pref-trigger: ${RECOMMEND_RECALL_MIN_PREF_TRIGGER:20}
    daily-limit: ${RECOMMEND_RECALL_DAILY_LIMIT:20}
  rerank:
    recall:
      query: ${RECOMMEND_RERANK_RECALL_QUERY:2.0}
      keyword: ${RECOMMEND_RERANK_RECALL_KEYWORD:1.5}
      pref-artist: ${RECOMMEND_RERANK_RECALL_PREF_ARTIST:2.5}
      pref-keyword: ${RECOMMEND_RERANK_RECALL_PREF_KEYWORD:2.0}
      daily-rank: ${RECOMMEND_RERANK_RECALL_DAILY:1.0}
      fallback: ${RECOMMEND_RERANK_RECALL_FALLBACK:0.5}
    recall-scale: ${RECOMMEND_RERANK_RECALL_SCALE:1.0}

video:
  detail:
    refresh-hours: ${VIDEO_DETAIL_REFRESH_HOURS:72}

# 安全相关的默认配置（建议按环境覆盖）
app:
  websocket:
    # 生产环境请配置为你的站点域名；避免使用 "*"
    allowed-origin-patterns: ${WS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
    cluster:
      enabled: ${WS_CLUSTER_ENABLED:false}
      channel: ${WS_CLUSTER_CHANNEL:ws:topic:broadcast}

audio:
  fingerprint:
    enabled: ${AUDIO_FP_ENABLED:false}
    base-url: ${AUDIO_FP_BASE_URL:}
    api-key: ${AUDIO_FP_API_KEY:}
    timeout-ms: ${AUDIO_FP_TIMEOUT_MS:4000}

http:
  client:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:2000}
    response-timeout-ms: ${HTTP_RESPONSE_TIMEOUT_MS:8000}

agent:
  execution:
    default-max-duration-ms: ${AGENT_EXECUTION_DEFAULT_MAX_DURATION_MS:180000}
  prefetch:
    scoring:
      enabled: ${AGENT_PREFETCH_SCORING_ENABLED:false}
      max-videos: ${AGENT_PREFETCH_SCORING_MAX_VIDEOS:50}

job:
  queue:
    enabled: ${JOB_QUEUE_ENABLED:false}
    poll-interval-ms: ${JOB_QUEUE_POLL_INTERVAL_MS:250}
    batch-size: ${JOB_QUEUE_BATCH_SIZE:4}
    max-attempts: ${JOB_QUEUE_MAX_ATTEMPTS:3}
    processing-timeout-ms: ${JOB_QUEUE_PROCESSING_TIMEOUT_MS:600000}
    dedup-ttl-ms: ${JOB_QUEUE_DEDUP_TTL_MS:86400000}
    worker:
      concurrency: ${JOB_QUEUE_WORKER_CONCURRENCY:2}

onlineLearning:
  training-enabled: ${ONLINE_LEARNING_TRAINING_ENABLED:false}
  enabled: ${ONLINE_LEARNING_ENABLED:false}
  treatment-ratio: ${ONLINE_LEARNING_TREATMENT_RATIO:0.0}
  model-name: ${ONLINE_LEARNING_MODEL_NAME:video-relevance-lr-v1}
  learning-rate: ${ONLINE_LEARNING_LR:0.05}
  l2: ${ONLINE_LEARNING_L2:0.001}
  max-batch-size: ${ONLINE_LEARNING_MAX_BATCH:100}
  score-scale: ${ONLINE_LEARNING_SCORE_SCALE:8.0}
  train-interval-ms: ${ONLINE_LEARNING_TRAIN_INTERVAL_MS:4000}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 20s
    instances:
      ollama:
        baseConfig: default
      bilibiliSearch:
        baseConfig: default
      audioFingerprint:
        baseConfig: default
  retry:
    instances:
      ollama:
        maxAttempts: 2
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      bilibiliSearch:
        maxAttempts: 2
        waitDuration: 300ms
      audioFingerprint:
        maxAttempts: 2
        waitDuration: 250ms
  ratelimiter:
    instances:
      ollama:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      bilibiliSearch:
        limitForPeriod: 3
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      audioFingerprint:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 0
  bulkhead:
    instances:
      ollama:
        maxConcurrentCalls: 4
        maxWaitDuration: 0
      bilibiliSearch:
        maxConcurrentCalls: 2
        maxWaitDuration: 0
      audioFingerprint:
        maxConcurrentCalls: 4
        maxWaitDuration: 0

media:
  download-dir: ${MEDIA_DOWNLOAD_DIR:downloads}
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  download-timeout-ms: ${MEDIA_DOWNLOAD_TIMEOUT_MS:30000}
  yt-dlp-path: ${YTDLP_PATH:yt-dlp}
  yt-dlp-cookies: ${YTDLP_COOKIES:}

logging:
  level:
    root: INFO
    com.example.bilibilimusic: DEBUG
    com.zaxxer.hikari: WARN
  file:
    name: logs/bilibili-music.log
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} trace=%X{traceId:-} span=%X{spanId:-} session=%X{sessionId:-} node=%X{nodeName:-} pv=%X{promptVersion:-} exec=%X{executionId:-} - %msg%n'
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} trace=%X{traceId:-} span=%X{spanId:-} session=%X{sessionId:-} node=%X{nodeName:-} pv=%X{promptVersion:-} exec=%X{executionId:-} - %msg%n'
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    baggage:
      correlation:
        fields: sessionId,executionId,nodeName,promptVersion
      remote-fields: sessionId,executionId,nodeName,promptVersion
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
