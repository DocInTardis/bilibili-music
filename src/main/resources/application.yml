spring:
  application:
    name: bilibili-music

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/bilibili?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:5000ms}
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开启驼峰命名映射
    map-underscore-to-camel-case: true
    # 打印 SQL 日志（生产环境建议关闭）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      # 主键类型（自增）
      id-type: auto

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen:7b}
  embeddings-enabled: ${OLLAMA_EMBEDDINGS_ENABLED:false}
  embedding-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

bilibili:
  search-url-template: "https://search.bilibili.com/all?keyword={query}&from_source=webtop_search&spm_id_from=333.1007&search_source=3"
  headless: ${BILIBILI_HEADLESS:false}  # 设置为 false 可以显示浏览器窗口，便于调试和观察

# 安全相关的默认配置（建议按环境覆盖）
app:
  websocket:
    # 生产环境请配置为你的站点域名；避免使用 "*"
    allowed-origin-patterns: ${WS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
    cluster:
      enabled: ${WS_CLUSTER_ENABLED:false}
      channel: ${WS_CLUSTER_CHANNEL:ws:topic:broadcast}

audio:
  fingerprint:
    enabled: ${AUDIO_FP_ENABLED:false}
    base-url: ${AUDIO_FP_BASE_URL:}
    api-key: ${AUDIO_FP_API_KEY:}

agent:
  prefetch:
    scoring:
      enabled: ${AGENT_PREFETCH_SCORING_ENABLED:true}
      max-videos: ${AGENT_PREFETCH_SCORING_MAX_VIDEOS:50}

logging:
  level:
    root: INFO
    com.example.bilibilimusic: DEBUG
  file:
    name: logs/bilibili-music.log
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} trace=%X{traceId:-} span=%X{spanId:-} session=%X{sessionId:-} node=%X{nodeName:-} pv=%X{promptVersion:-} exec=%X{executionId:-} - %msg%n'
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} trace=%X{traceId:-} span=%X{spanId:-} session=%X{sessionId:-} node=%X{nodeName:-} pv=%X{promptVersion:-} exec=%X{executionId:-} - %msg%n'
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    baggage:
      correlation:
        fields: sessionId,executionId,nodeName,promptVersion
      remote-fields: sessionId,executionId,nodeName,promptVersion
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
